name: Publish ReShade preset test prerelease
on:
  push:
    branches: ["release-test/v0.11.5-dev1"]
    paths:
      - .github/workflows/reshade-preset-test-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: v0.11.5-dev1
    steps:
      - uses: actions/checkout@v4
      - name: Verify and package the prerelease
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "${TAG#v}"
          git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
          python3 -m unittest discover -s tests -p 'test_reshade*.py'
          python3 -m unittest discover -s tests -p test_toolbox_return.py
          root="Ultimate-Wine-Toolbox-$TAG"
          mkdir dist
          git archive --format=zip --prefix="$root/" --output="dist/$root.zip" HEAD \
            VERSION package-install.sh uninstall.sh README.md README.fr.md RELEASING.md release-notes docs community-catalog toolbox
          cd dist
          sha256sum "$root.zip" > "$root.zip.sha256"
          sha256sum -c "$root.zip.sha256"
      - name: Publish the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/Ultimate-Wine-Toolbox-$TAG.zip"
          gh release create "$TAG" "$asset" "$asset.sha256" --target "$GITHUB_SHA" \
            --title "Ultimate Wine Toolbox $TAG" --notes-file "release-notes/$TAG.md" \
            --prerelease --latest=false
